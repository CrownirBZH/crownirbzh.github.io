<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c10" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon-96.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Titre, description, balises de partage et données structurées :
         générés pour chaque page par scripts/prerender.mjs. -->
    <!--app-head-->
    <script>
      // La classe « js » autorise les animations d'apparition. Si le script
      // principal ne démarre pas, elle est retirée : rien ne reste masqué.
      document.documentElement.classList.add('js')
      setTimeout(() => {
        if (!window.__appReady) document.documentElement.classList.remove('js')
      }, 4000)
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
